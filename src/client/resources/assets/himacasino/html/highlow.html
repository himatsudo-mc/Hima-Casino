<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><title>High &amp; Low</title>
<link rel="stylesheet" href="casino.css"><script src="casino.js"></script></head>
<body><script>
const body = Casino.frame('HIGH &amp; LOW', 'ディーラーより大きいカードを選ぼう');
Casino.onState(function (s) {
  Casino.setBalance(s);
  body.innerHTML = '';
  const center = Casino.el('div', 'center');

  if (s.phase === 'BET') {
    center.appendChild(Casino.el('div', 'hint', '勝てば <b style="color:var(--gold)">×' + s.multiplier + '</b> の払い戻し<br>最小 ' + Casino.fmt(s.min) + ' / 最大 ' + Casino.fmt(s.max) + ' ' + s.symbol));
    const demo = Casino.el('div', 'hand');
    demo.appendChild(Casino.card({ hidden: true }));
    demo.appendChild(Casino.el('div', 'title', 'VS'));
    demo.appendChild(Casino.card({ hidden: true }));
    center.appendChild(demo);
  } else {
    const dealer = Casino.el('div');
    dealer.appendChild(Casino.el('div', 'hand-label', 'DEALER'));
    const dh = Casino.el('div', 'hand');
    dh.appendChild(Casino.rankCard(s.dealer));
    dealer.appendChild(dh);
    center.appendChild(dealer);

    const row = Casino.el('div', 'hand');
    row.style.gap = '40px';
    for (let i = 0; i < 2; i++) {
      let c;
      if (s.phase === 'PLAYING') {
        c = Casino.card({ hidden: true });
        c.classList.add('pick');
        c.onclick = () => Casino.send({ a: 'pick', i: i });
      } else {
        c = Casino.rankCard(i === 0 ? s.left : s.right);
        if (i === s.chosen) c.classList.add('mine');
        else c.classList.add('dim');
      }
      row.appendChild(c);
    }
    center.appendChild(row);

    if (s.phase === 'PLAYING') {
      center.appendChild(Casino.el('div', 'hint', 'カードを 1 枚選んでください — ディーラーより大きければ勝ち<br>BET ' + Casino.fmt(s.bet) + ' ' + s.symbol));
    } else if (s.resultPending) {
      center.appendChild(Casino.el('div', 'banner', '...'));
    } else {
      const map = { WIN: ['WIN!  +' + Casino.fmt(s.payout), 'win'], LOSE: ['LOSE', 'lose'], DRAW: ['DRAW  ベット返却', 'push'] };
      const m = map[s.outcome] || ['', ''];
      center.appendChild(Casino.el('div', 'banner ' + m[1], m[0]));
    }
  }
  body.appendChild(center);

  const bar = Casino.el('div', 'bar');
  bar.style.cssText = 'padding:14px 20px 18px;min-height:112px;flex-wrap:wrap';
  if (s.phase === 'BET') {
    bar.appendChild(Casino.chips(s));
    bar.appendChild(Casino.el('div', 'betbox', '<div class="lbl">BET</div><div class="val">' + Casino.fmt(s.bet) + '</div>'));
    bar.appendChild(Casino.btn('CLEAR', 'dark small', () => Casino.send({ a: 'clear' })));
    bar.appendChild(Casino.btn('▶ PLAY', 'green', () => Casino.send({ a: 'play' }), !s.canPlay));
  } else if (s.phase === 'RESULT' && !s.resultPending) {
    bar.appendChild(Casino.btn('▶ もう一度', 'green', () => Casino.send({ a: 'again' }), !s.canAgain));
    bar.appendChild(Casino.btn('ベット変更', '', () => Casino.send({ a: 'change' })));
  }
  body.appendChild(bar);
  const ex = Casino.btn('退出', 'dark small', () => Casino.send({ a: 'exit' }));
  ex.className += ' exit';
  body.appendChild(ex);
});
</script></body></html>

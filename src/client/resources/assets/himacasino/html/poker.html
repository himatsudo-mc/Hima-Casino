<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><title>Poker</title>
<link rel="stylesheet" href="casino.css"><script src="casino.js"></script></head>
<body><script>
const body = Casino.frame('POKER', 'ファイブカードドロー vs ハウス');
Casino.onState(function (s) {
  Casino.setBalance(s);
  body.innerHTML = '';
  const center = Casino.el('div', 'center');
  center.style.gap = '6px';

  // ディーラー
  const dealer = Casino.el('div');
  dealer.appendChild(Casino.el('div', 'hand-label', 'DEALER' + (s.dealerHand ? '<b>' + s.dealerHand + '</b>' : '')));
  const dh = Casino.el('div', 'hand');
  dh.style.minHeight = '110px';
  if (s.dealer.length === 0) { for (let i = 0; i < 5; i++) dh.appendChild(Casino.card({ hidden: true })); }
  Casino.dealCards('dealer', s.dealer, c => Casino.card(c)).forEach(e => dh.appendChild(e));
  dh.querySelectorAll('.card').forEach(c => { c.style.transform = 'scale(.88)'; });
  if (s.phase === 'ANTE') dh.classList.add('dim');
  dealer.appendChild(dh);
  center.appendChild(dealer);

  // 中央の情報
  const info = Casino.el('div', 'bar');
  info.style.minHeight = '56px';
  if (s.phase === 'ANTE') {
    info.appendChild(Casino.el('div', 'hint', 'アンティを決めて DEAL — 5 枚配られ、1 回だけ交換できます<br>最小 ' + Casino.fmt(s.min) + ' / 最大 ' + Casino.fmt(s.max) + ' ' + s.symbol));
  } else if (s.phase === 'RESULT') {
    const map = { WIN: ['WIN!  +' + Casino.fmt(s.payout), 'win'], DEALER_FOLDED: ['DEALER FOLDED  +' + Casino.fmt(s.payout), 'win'],
                  LOSE: ['LOSE', 'lose'], PLAYER_FOLDED: ['FOLDED', 'lose'], PUSH: ['PUSH  賭け金返却', 'push'] };
    const m = map[s.result] || ['', ''];
    info.appendChild(Casino.el('div', 'banner ' + m[1], m[0]));
  } else {
    info.appendChild(Casino.el('div', 'betbox', '<div class="lbl">POT</div><div class="val">' + Casino.fmt(s.pot) + '</div>'));
    if (s.phase === 'DRAW') info.appendChild(Casino.el('div', 'hint', '交換するカードをクリックして選択 → DRAW で確定'));
    if (s.phase === 'BETTING' && s.awaitingCall)
      info.appendChild(Casino.el('div', 'banner lose', 'ディーラーが ' + Casino.fmt(s.dealerBet) + ' ' + s.symbol + ' をベット！'));
  }
  center.appendChild(info);

  // プレイヤー
  const player = Casino.el('div');
  player.appendChild(Casino.el('div', 'hand-label', 'YOU' + (s.playerHand ? '<b>' + s.playerHand + '</b>' : '')));
  const ph = Casino.el('div', 'hand');
  Casino.dealCards('player', s.player, c => Casino.card(c)).forEach((el, i) => {
    if (s.phase === 'DRAW') {
      el.classList.add('pick');
      if (s.exchange.includes(i)) el.classList.add('up');
      el.onclick = () => Casino.send({ a: 'toggle', i: i });
    }
    ph.appendChild(el);
  });
  if (s.player.length === 0) { for (let i = 0; i < 5; i++) { const b = Casino.card({ hidden: true }); b.classList.add('dim'); ph.appendChild(b); } }
  player.appendChild(ph);
  center.appendChild(player);
  body.appendChild(center);

  // 操作
  const bar = Casino.el('div', 'bar');
  bar.style.cssText = 'padding:10px 20px 16px;min-height:104px;flex-wrap:wrap';
  if (s.phase === 'ANTE') {
    bar.appendChild(Casino.chips(s));
    bar.appendChild(Casino.el('div', 'betbox', '<div class="lbl">ANTE</div><div class="val">' + Casino.fmt(s.ante) + '</div>'));
    bar.appendChild(Casino.btn('CLEAR', 'dark small', () => Casino.send({ a: 'clear' })));
    bar.appendChild(Casino.btn('▶ DEAL', 'green', () => Casino.send({ a: 'deal' }), !s.canDeal));
  } else if (s.phase === 'DRAW') {
    const n = s.exchange.length;
    bar.appendChild(Casino.btn(n ? '▶ ' + n + ' 枚交換する' : '▶ STAND PAT (交換なし)', 'green', () => Casino.send({ a: 'draw' })));
  } else if (s.phase === 'BETTING' && s.awaitingCall) {
    bar.appendChild(Casino.btn('CALL ' + Casino.fmt(s.dealerBet), 'green', () => Casino.send({ a: 'call' }), !s.canCall));
    bar.appendChild(Casino.btn('FOLD', 'red', () => Casino.send({ a: 'fold' })));
  } else if (s.phase === 'BETTING') {
    if (s.canRaise) {
      bar.appendChild(Casino.chips(s));
      bar.appendChild(Casino.el('div', 'betbox', '<div class="lbl">BET</div><div class="val">' + Casino.fmt(s.raise) + '</div>'));
      bar.appendChild(Casino.btn('CLEAR', 'dark small', () => Casino.send({ a: 'clear' })));
      bar.appendChild(Casino.btn('BET', 'green', () => Casino.send({ a: 'bet' }), s.raise < s.min));
    }
    bar.appendChild(Casino.btn('CHECK', '', () => Casino.send({ a: 'check' })));
    bar.appendChild(Casino.btn('FOLD', 'red', () => Casino.send({ a: 'fold' })));
  } else {
    bar.appendChild(Casino.btn('▶ もう一度', 'green', () => Casino.send({ a: 'again' }), !s.canAgain));
    bar.appendChild(Casino.btn('アンティ変更', '', () => Casino.send({ a: 'change' })));
  }
  body.appendChild(bar);
  const ex = Casino.btn('退出', 'dark small', () => Casino.send({ a: 'exit' }));
  ex.className += ' exit';
  body.appendChild(ex);
});
</script></body></html>

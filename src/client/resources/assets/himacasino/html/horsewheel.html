<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><title>Horse Wheel</title>
<link rel="stylesheet" href="casino.css"><script src="casino.js"></script>
<style>
  .layout { flex: 1; display: flex; flex-direction: column; padding: 14px 24px; gap: 14px; }
  .horses { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; flex: 1; }
  .horse {
    position: relative; border-radius: 16px; cursor: pointer; padding: 14px;
    background: rgba(0,0,0,.4); border: 3px solid rgba(255,255,255,.18);
    display: flex; align-items: center; gap: 14px; transition: transform .08s, border-color .1s;
  }
  .horse:hover { transform: translateY(-3px); }
  .horse.sel { border-color: var(--gold); box-shadow: 0 0 0 3px rgba(242,193,78,.45), 0 0 22px rgba(242,193,78,.45); }
  .dot { width: 64px; height: 64px; border-radius: 14px; border: 3px solid #fff; box-shadow: 0 4px 8px rgba(0,0,0,.5); flex: none; }
  .horse .nm { font-size: 20px; font-weight: 900; letter-spacing: .08em; }
  .horse .mul { font-size: 30px; font-weight: 900; color: var(--gold); line-height: 1.05; }
  .horse .bt { font-size: 14px; color: var(--muted); margin-top: 3px; }
  .horse .bt b { color: var(--good); font-size: 17px; }
  .last { text-align: center; font-size: 15px; color: var(--muted); }
  .last b { color: var(--gold); }
</style></head>
<body><script>
const COLORS = ['#f4f4f4', '#ffd23f', '#2fc4d6', '#35c46b', '#e64a4a', '#d4a017'];
const NAMES  = ['WHITE', 'YELLOW', 'BLUE', 'GREEN', 'RED', 'GOLD'];
const body = Casino.frame('HORSE WHEEL', '馬の色にベット — ホイールが止まった位置で判定');
Casino.onState(function (s) {
  Casino.setBalance(s);
  body.innerHTML = '';
  const layout = Casino.el('div', 'layout');

  const grid = Casino.el('div', 'horses');
  s.horses.forEach((h, i) => {
    const d = Casino.el('div', 'horse' + (s.selected === i ? ' sel' : ''));
    d.innerHTML = '<div class="dot" style="background:' + COLORS[i] + '"></div><div><div class="nm" style="color:' + COLORS[i] + '">' + NAMES[i] +
      '</div><div class="mul">×' + h.multiplier + '</div><div class="bt">BET <b>' + Casino.fmt(h.bet) + '</b> ' + s.symbol + '</div></div>';
    d.onclick = () => Casino.send({ a: 'select', i: i });
    grid.appendChild(d);
  });
  layout.appendChild(grid);

  if (s.lastHorse >= 0) {
    layout.appendChild(Casino.el('div', 'last', '前回の結果: <b style="color:' + COLORS[s.lastHorse] + '">' + NAMES[s.lastHorse] + '</b>' +
      (s.lastWin > 0 ? ' — <b>+' + Casino.fmt(s.lastWin) + ' ' + s.symbol + '</b>' : ' — ハズレ')));
  } else {
    layout.appendChild(Casino.el('div', 'last', '馬をクリックして選び、チップを積んで SPIN'));
  }

  const bar = Casino.el('div', 'bar');
  bar.style.cssText = 'min-height:96px;flex-wrap:wrap';
  bar.appendChild(Casino.chips(s));
  bar.appendChild(Casino.el('div', 'betbox', '<div class="lbl">TOTAL</div><div class="val">' + Casino.fmt(s.total) + '</div>'));
  bar.appendChild(Casino.btn('CLEAR', 'dark small', () => Casino.send({ a: 'clear' })));
  bar.appendChild(Casino.btn('▶ SPIN', 'green', () => Casino.send({ a: 'spin' }), !s.canSpin));
  layout.appendChild(bar);
  body.appendChild(layout);

  const ex = Casino.btn('退出', 'dark small', () => Casino.send({ a: 'exit' }));
  ex.className += ' exit';
  body.appendChild(ex);
});
</script></body></html>

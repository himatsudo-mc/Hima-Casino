# ─────────────────────────────────────────────────────────
#  HimaCasino 設定ファイル
#  Purpur 1.21.1 向けカジノプラグイン
# ─────────────────────────────────────────────────────────

# 経済で使用する通貨の表示名 (Vault 無効時は無視)
currency-symbol: "コイン"

# ════════════════════════════════════════════════════
# スロットマシン
# ════════════════════════════════════════════════════
slots:
  # デフォルトのスロット設定 (1 〜 6)
  # 設定番号が高いほど 7 や高配当シンボルの出現率が上がります
  default-setting: 1

  min-bet: 10.0
  max-bet: 10000.0

  # 各設定のシンボル出現ウェイト (インデックス 0=シンボル1, 1=シンボル2, ..., 6=シンボル7)
  settings:
    1:
      weights: [30, 25, 20, 15, 5, 3, 2]   # 設定1: 7 の出現率 2/100
    2:
      weights: [28, 23, 19, 14, 6, 5, 5]   # 設定2
    3:
      weights: [25, 22, 18, 14, 7, 7, 7]   # 設定3
    4:
      weights: [23, 20, 17, 13, 9, 9, 9]   # 設定4
    5:
      weights: [20, 18, 16, 12, 12, 11, 11] # 設定5
    6:
      weights: [18, 16, 14, 12, 13, 13, 14] # 設定6: 7 の出現率 最大

  # 配当倍率 (ベット額に対する倍率)
  payouts:
    7-7-7:          100.0   # ジャックポット
    3-of-a-kind:     10.0   # 3つ揃い (7以外)
    two-7s:           5.0   # 7 が 2つ
    one-7:            2.0   # 7 が 1つ
    two-of-a-kind:    1.5   # 2つ揃い (7以外)

# ════════════════════════════════════════════════════
# ルーレット
# ════════════════════════════════════════════════════
roulette:
  min-bet: 10.0
  max-bet: 10000.0

  # ホイールが止まるまでのチック数 (20 ticks = 1 秒)
  spin-ticks: 200

  # ベット配当 (参考: コードで直接計算されます)
  # 単一数字: 35:1
  # 色 (red/black): 1:1

# ════════════════════════════════════════════════════
# HIGH & LOW
# ════════════════════════════════════════════════════
highlow:
  min-bet: 10.0
  max-bet: 10000.0

  # 勝利時の倍率 (1.9 = ベット額の 1.9 倍を受け取る)
  win-multiplier: 1.9

# ════════════════════════════════════════════════════
# BLACKJACK
# ════════════════════════════════════════════════════
blackjack:
  min-bet: 10.0
  max-bet: 10000.0

# ════════════════════════════════════════════════════
# リソースパック
# カードグラフィック付き GUI を表示するには、同梱の
# BlackjackResourcePack.zip をどこかにホストし、その URL を
# 設定してください (未設定の場合はパックを配布しません)。
# ════════════════════════════════════════════════════
resource-pack:
  # 有効化するかどうか
  enabled: false

  # リソースパック ZIP の配布先 URL (http(s)://... または直リンク)
  url: ""

  # ZIP の SHA-1 ハッシュ (任意。空欄で省略可、設定すると再ダウンロードを抑制できます)
  sha1: ""

  # プレイヤー参加時に表示する催促メッセージ
  prompt-message: "&aHimaCasino のカードグラフィックを表示するには、リソースパックの適用をお願いします。"

  # true にすると、プレイヤーがリソースパックを拒否した際にサーバーから切断します
  force: false

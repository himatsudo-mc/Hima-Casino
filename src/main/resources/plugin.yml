name: HimaCasino
version: 1.0.0
main: com.himacasino.HimaCasino
api-version: '26.3'
description: Purpur 26.3 向け Display Entity ベースのカジノプラグイン
authors: [HimaCasino]

softdepend:
  - Vault

commands:
  casino:
    description: HimaCasino のメインコマンド
    usage: /casino <roulette|highlow|blackjack|poker|help|setting|setmachine|delmachine>
    aliases: [hc]
    permission: himacasino.play

permissions:
  himacasino.play:
    description: カジノゲームをプレイできる
    default: true
  himacasino.admin:
    description: 管理者コマンドを使用できる (設定変更・マシン設置)
    default: op
